<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
  <title id="title">Apple 智能购物助手对话工作流</title>
  <desc id="desc">从用户输入到腾讯云 ADP SSE 响应、前端打字机队列、React 状态更新和 Markdown 完成态渲染的流程图。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050507"/>
      <stop offset="0.55" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#56a8ff"/>
      <stop offset="1" stop-color="#6d5dfc"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#669dff"/>
    </marker>
  </defs>

  <rect width="1280" height="560" rx="34" fill="url(#bg)"/>
  <circle cx="1040" cy="80" r="220" fill="#3451ff" opacity="0.08"/>
  <circle cx="160" cy="500" r="260" fill="#2d8cff" opacity="0.06"/>

  <text x="70" y="76" fill="#f5f5f7" font-size="30" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-weight="600">实时对话工作流</text>
  <text x="70" y="108" fill="#a1a1aa" font-size="16" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">真实 SSE 流 + 前端逐字呈现 + 完成态 Markdown</text>

  <g filter="url(#shadow)">
    <g transform="translate(70 165)">
      <rect width="205" height="150" rx="24" fill="#ffffff" fill-opacity="0.065" stroke="#ffffff" stroke-opacity="0.14"/>
      <circle cx="42" cy="42" r="17" fill="url(#blue)"/>
      <text x="72" y="49" fill="#f5f5f7" font-size="19" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-weight="600">用户输入</text>
      <text x="28" y="91" fill="#c7c7ce" font-size="15" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">提交购买需求</text>
      <text x="28" y="118" fill="#8f93a1" font-size="13" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">立即创建用户与 AI 消息</text>
    </g>

    <g transform="translate(330 165)">
      <rect width="225" height="150" rx="24" fill="#ffffff" fill-opacity="0.065" stroke="#ffffff" stroke-opacity="0.14"/>
      <circle cx="42" cy="42" r="17" fill="url(#blue)"/>
      <text x="72" y="49" fill="#f5f5f7" font-size="19" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-weight="600">请求封装</text>
      <text x="28" y="91" fill="#c7c7ce" font-size="15" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">UUID 与会话上下文</text>
      <text x="28" y="118" fill="#8f93a1" font-size="13" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">环境变量提供接口配置</text>
    </g>

    <g transform="translate(610 165)">
      <rect width="245" height="150" rx="24" fill="#ffffff" fill-opacity="0.075" stroke="#74a7ff" stroke-opacity="0.32"/>
      <circle cx="42" cy="42" r="17" fill="url(#blue)"/>
      <text x="72" y="49" fill="#f5f5f7" font-size="19" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-weight="600">ADP SSE 流</text>
      <text x="28" y="91" fill="#c7c7ce" font-size="15" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">ReadableStream 实时读取</text>
      <text x="28" y="118" fill="#8f93a1" font-size="13" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">text.delta / text.replace</text>
    </g>

    <g transform="translate(910 165)">
      <rect width="300" height="150" rx="24" fill="#ffffff" fill-opacity="0.065" stroke="#ffffff" stroke-opacity="0.14"/>
      <circle cx="42" cy="42" r="17" fill="url(#blue)"/>
      <text x="72" y="49" fill="#f5f5f7" font-size="19" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-weight="600">打字机与状态更新</text>
      <text x="28" y="91" fill="#c7c7ce" font-size="15" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">按字符进入 30ms 展示队列</text>
      <text x="28" y="118" fill="#8f93a1" font-size="13" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">只更新同一条 assistant 消息</text>
    </g>
  </g>

  <path d="M 275 240 L 324 240" stroke="#669dff" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M 555 240 L 604 240" stroke="#669dff" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M 855 240 L 904 240" stroke="#669dff" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>

  <path d="M 1060 315 L 1060 375 L 830 375" fill="none" stroke="#669dff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>

  <g transform="translate(445 375)" filter="url(#shadow)">
    <rect width="385" height="120" rx="24" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.15"/>
    <text x="28" y="42" fill="#f5f5f7" font-size="19" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-weight="600">完成态渲染</text>
    <text x="28" y="75" fill="#c7c7ce" font-size="15" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">Markdown + GFM · 首字耗时 · 总耗时</text>
    <text x="28" y="99" fill="#8f93a1" font-size="13" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">异常时保留同一消息并显示友好提示</text>
  </g>
</svg>
